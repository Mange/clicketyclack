[package]
name = "clicketyclack"
version = "0.2.0"
authors = ["Magnus Bergmark <me@mange.dev>"]
license = "MIT"
edition = "2021"
build = "build.rs"

[dependencies]
# For Pulseaudio support.
#  https://github.com/RustAudio/rodio/pull/888
# No release yet as of 2026-10-30.
rodio = { git = "https://github.com/RustAudio/rodio.git", default-features = false, features = ["simd", "wav", "playback"] }

clap = { version = "4.6", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[build-dependencies]
cc = "1.0"
